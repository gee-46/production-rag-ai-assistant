services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/ragdb
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/ragdb
    volumes:
      - uploads:/app/data/uploads
      - hf_cache:/home/appuser/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "app.services.jobs.worker"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/ragdb
    volumes:
      - uploads:/app/data/uploads
      - hf_cache:/home/appuser/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 1  # scale horizontally with `docker compose up --scale worker=3`

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["streamlit", "run", "frontend/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_started


volumes:
  pgdata:
  uploads:
  hf_cache:

